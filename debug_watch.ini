// ==================== Keil Watch直接标定面板 ====================
// 先改十进制参数，再把对应*_req写1；执行一次后*_req会自动回0。
// 只改参数不会让电机立即动，避免Watch输入中途误动作。
// 推荐的混合用法：只在Watch改角度、齿条、观察高度、放置高度四类参数，
// 动作用VOFA 8C/8D/8E/8F执行；P1必须写当前圆环号1/2/3，若和
// selected_ring不一致，命令会被拒绝。
// 此时完全不用操作apply_*_req标志位，这些标志只为纯Watch模式保留。
WS 2, cal_dbg_takeover_req
// 接管后先等override_ready由0变1，再触发路线或机械臂动作。
WS 2, robot_app_vofa_override
WS 2, robot_app_vofa_override_ready
WS 2, cal_dbg_rough_start_req
WS 2, cal_dbg_storage_start_req
WS 2, cal_dbg_home_confirm_req
WS 2, cal_dbg_ring
WS 2, cal_dbg_select_ring_req
WS 2, cal_dbg_carousel_deg
WS 2, cal_dbg_apply_carousel_req
WS 2, cal_dbg_slide_mm
WS 2, cal_dbg_apply_slide_req
WS 2, cal_dbg_drop_mm
WS 2, cal_dbg_apply_drop_req
// 两个高度都是“从丝杆最高原点累计下降”的绝对值，不是从当前位置再下降。
// observe默认100；粗加工和暂存place均默认185（相对最高原点的绝对下降量）。
WS 2, cal_dbg_observe_drop_mm
WS 2, cal_dbg_place_drop_mm
WS 2, cal_dbg_apply_observe_drop_req
WS 2, cal_dbg_apply_place_drop_req
// 当前绝对下降量；last_delta正数=本次向下，负数=本次向上。
WS 2, cal_dbg_current_drop_mm
WS 2, cal_dbg_last_gimbal_delta_mm
// 分轴按钮：raise只抬丝杆；slide_retract只收齿条且要求丝杆已回最高点。
WS 2, cal_dbg_raise_only_req
WS 2, cal_dbg_slide_retract_only_req
// 旧retract是组合回收：先抬丝杆，再收齿条。
WS 2, cal_dbg_retract_req
